# cargo-deny: Lizenzen, Sicherheitsmeldungen und Herkunft aller Abhängigkeiten.
# Läuft in CI als eigener Job (.github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Nur Lizenzen, die mit MPL-2.0 (App) und MIT/Apache-2.0 (Bibliotheken)
# vereinbar und App-Store-tauglich sind. Keine GPL/LGPL/AGPL.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

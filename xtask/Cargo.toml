[package]
name = "xtask"
description = "Build- und Prüfaufgaben für OpenFlightDeck (cargo xtask ci)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "xtask"

[lints]
workspace = true

[dependencies]
serde_json = "1"
# Nur für das Werkzeug uniffi-bindgen (src/bin), nicht für die App.
uniffi = { version = "0.32", features = ["cli"] }

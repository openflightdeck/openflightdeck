[package]
name = "ofd-ffi"
description = "UniFFI-Bindings des OpenFlightDeck-Kerns für Swift"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
# staticlib für das XCFramework, lib für Tests und Bindgen.
crate-type = ["lib", "staticlib"]

# Eigene Lints statt der Workspace-Lints: UniFFI erzeugt unsafe-Code, deshalb
# ist unsafe hier nur auf deny statt forbid gesetzt und wird in lib.rs
# begründet erlaubt. Sonst identisch mit [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
print_stdout = "warn"

[dependencies]
ofd-core.workspace = true
uniffi = "0.32"
